<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#090d11"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="ANGA"><meta name="description" content="Offline workout and Sri Lankan nutrition tracker"><link rel="manifest" href="manifest.webmanifest?v=5.0.1"><link rel="apple-touch-icon" href="icons/icon-180.png?v=5.0.1"><link rel="stylesheet" href="style.css?v=5.0.1"><link rel="stylesheet" href="nutrition.css?v=5.0.1"><title>ANGA</title><style id="fixed-rest-timer-style">
